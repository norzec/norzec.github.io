<title>Portal de Verificação — NORZEC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500;600;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#f4f6f9;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 24px #0002;
  max-width:480px;width:100%;overflow:hidden}
.card-header{background:#0B1411;padding:32px;text-align:center}
.card-header .logo{display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.card-header .logo img{height:60px;width:auto}
.card-header h2{color:#fff;font-family:'Cinzel',serif;font-size:16px;
  letter-spacing:1.5px;font-weight:400;opacity:.85}
.card-body{padding:36px}
p{font-size:14px;color:#555;line-height:1.7;margin-bottom:20px}
.input-group{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;border:1.5px solid #ddd;border-radius:8px;padding:12px 14px;
  font-size:13px;font-family:monospace;outline:none;transition:.2s}
input:focus{border-color:#10B981}
button{background:#0B1411;color:#fff;border:none;border-radius:8px;
  padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:'Montserrat',sans-serif;transition:.2s}
button:hover{background:#0B1411}
.note{font-size:11px;color:#aaa;line-height:1.6;text-align:center;margin-top:16px}
</style>

  </div>
  <div class="card-body">
    <p>Para verificar a autenticidade de um certificado NORZEC, acesse o QR
       code impresso no documento ou insira o código abaixo.</p>
    <div class="input-group">
      <input id="codigo" type="text" placeholder="NORZEC-LC001-2026-xxxxxxxxxxxx">
      <button onclick="verificar()">Verificar</button>
    </div>
    <div class="note">
      Os certificados desta plataforma são emitidos pelo Centro de Formação NORZEC.<br>
      Dúvidas: <a href="mailto:norzecmz@gmail.com"><strong>norzecmz@gmail.com</strong></a>

<script>
function redirecionar_se_url(){
  var p=new URLSearchParams(window.location.search);var c=p.get("c");
  if(c){window.location.replace("/verificar/"+encodeURIComponent(c)+"/");}
}
redirecionar_se_url();
function verificar(){
  const c = document.getElementById('codigo').value.trim();
  if(!c){alert('Insira o código do certificado.');return;}
  window.location.href = '/verificar/' + encodeURIComponent(c) + '/';
}
document.getElementById('codigo').addEventListener('keydown', e=>{
  if(e.key==='Enter') verificar();
});
</script>
